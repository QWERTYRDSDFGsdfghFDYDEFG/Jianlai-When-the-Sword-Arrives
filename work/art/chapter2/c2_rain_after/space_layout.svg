<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#faf9f5"/><g font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#333"><text x="40" y="40">四楼外廊 · 俯视空间关系（设计示意，非正式原画）</text><rect x="50" y="90" width="300" height="460" fill="#ddd8ce" stroke="#555"/><text x="140" y="140">房间 / 木墙</text><rect x="350" y="90" width="340" height="460" fill="#eee9df" stroke="#555"/><text x="440" y="140">有顶廊道</text><path d="M690 90V550" stroke="#654" stroke-width="12"/><text x="710" y="145">外侧木栏</text><rect x="785" y="180" width="360" height="370" fill="#e4edf0"/><text x="860" y="300">楼下铁券河</text><text x="860" y="340">更远是青山</text><circle cx="570" cy="300" r="35" fill="#b9bdbe" stroke="#333"/><text x="410" y="285">陈平安</text><path d="M590 286L640 270" stroke="#333" stroke-width="3"/><text x="430" y="350">摊掌在身前</text><circle cx="420" cy="470" r="15" fill="#566"/><path d="M420 470L555 315M420 470L670 350" fill="none" stroke="#566" stroke-width="2" stroke-dasharray="8 5"/><text x="380" y="525">机位</text><text x="50" y="610">人和相机都在廊内；木栏在外，河面在楼下；不跃栏，不加入其他角色。</text></g></svg>